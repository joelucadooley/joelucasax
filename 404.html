<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Joe Luca</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #060810;
      color: #ede8df;
      font-family: 'Jost', system-ui, sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .inner { max-width: 480px; }
    .num {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(6rem, 20vw, 10rem);
      font-weight: 300;
      line-height: 1;
      color: #e8d4a8;
      font-style: italic;
    }
    .rule {
      width: 60px; height: 1px;
      background: linear-gradient(90deg, transparent, #c9a96e, transparent);
      margin: 2rem auto;
    }
    p {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 1.2rem;
      color: #7a7468;
      margin-bottom: 2.5rem;
    }
    a {
      display: inline-block;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #c9a96e;
      text-decoration: none;
      border: 0.5px solid rgba(201,169,110,0.3);
      padding: 0.9rem 2.5rem;
      transition: all 0.25s;
    }
    a:hover { background: #c9a96e; color: #060810; }
  </style>
</head>
<body>
  <div class="inner">
    <div class="num">404</div>
    <div class="rule"></div>
    <p>This page seems to have improvised its way somewhere else.</p>
    <a href="/">Back to the music</a>
  </div>
</body>
</html>
